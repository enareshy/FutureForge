# EXAMPLE ONLY — do not commit real secrets.
#
# Credential for the isolated restore/drill target role `ai_restore`.
#
# This is a SEPARATE Secret on purpose. `ai-api-secrets` is injected wholesale
# into the API, the workers and the daily backup Job with `envFrom`; putting the
# restore credential there would hand every serving pod a role that can create
# databases and write the whole schema. Only `ai-restore-drill` mounts this one.
#
# Create the real secret out-of-band, e.g. with Sealed Secrets / External
# Secrets Operator, or:
#
#   kubectl -n enterprise-ai create secret generic ai-restore-secret \
#     --from-literal=password='<ai_restore password from the secret manager>'
#
# The values below are inert placeholders so the manifest renders; never apply
# them as-is. Delete the CronJob (and this Secret) if the organisation runs
# drills manually with an operator-held credential instead.
apiVersion: v1
kind: Secret
metadata:
  name: ai-restore-secret
  labels:
    app.kubernetes.io/name: ai-backup
    app.kubernetes.io/part-of: enterprise-ai-platform
type: Opaque
stringData:
  password: "CHANGE_ME"
