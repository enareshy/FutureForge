# EXAMPLE ONLY — do not commit real secrets.
#
# Create the real secret out-of-band, e.g. with kubeseal/Sealed Secrets,
# External Secrets Operator, or:
#
#   kubectl -n enterprise-ai create secret generic ai-api-secrets \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=LLM_API_KEY='...' \
#     --from-literal=S3_ACCESS_KEY_ID='...' \
#     --from-literal=S3_SECRET_ACCESS_KEY='...'
#
# The Deployment consumes it with `envFrom.secretRef`. The values below are
# inert placeholders so the manifest renders; never apply them as-is.
apiVersion: v1
kind: Secret
metadata:
  name: ai-api-secrets
  labels:
    app.kubernetes.io/name: ai-api
    app.kubernetes.io/part-of: enterprise-ai-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  # Only required when LLM_PROVIDER is a real provider.
  LLM_API_KEY: ""
  LLM_BASE_URL: ""
  LLM_CHAT_MODEL: ""
  LLM_EMBEDDING_MODEL: ""
  # Only required when the S3-backed object store needs credentials.
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  # Optional backends.
  OPENSEARCH_USERNAME: ""
  OPENSEARCH_PASSWORD: ""
  GRAFANA_ADMIN_PASSWORD: ""
