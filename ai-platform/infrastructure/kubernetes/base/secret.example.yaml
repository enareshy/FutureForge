# EXAMPLE ONLY — do not commit real secrets.
#
# Create the real secret out-of-band, e.g. with kubeseal/Sealed Secrets,
# External Secrets Operator, or:
#
#   kubectl -n enterprise-ai create secret generic ai-api-secrets \
#     --from-literal=AI_API_POSTGRES_PASSWORD='...' \
#     --from-literal=AI_WORKER_POSTGRES_PASSWORD='...' \
#     --from-literal=AI_BACKUP_POSTGRES_PASSWORD='...' \
#     --from-literal=AI_MIGRATION_POSTGRES_PASSWORD='...' \
#     --from-literal=LLM_API_KEY='...' \
#     --from-literal=S3_ACCESS_KEY_ID='...' \
#     --from-literal=S3_SECRET_ACCESS_KEY='...'
#
# The Deployment consumes it with `envFrom.secretRef`. The values below are
# inert placeholders so the manifest renders; never apply them as-is.
apiVersion: v1
kind: Secret
metadata:
  name: ai-api-secrets
  labels:
    app.kubernetes.io/name: ai-api
    app.kubernetes.io/part-of: enterprise-ai-platform
type: Opaque
stringData:
  # One password per non-owner PostgreSQL role. Provision the roles and rotate
  # these values together; see infrastructure/db/roles/README.md.
  AI_API_POSTGRES_PASSWORD: "CHANGE_ME"
  AI_WORKER_POSTGRES_PASSWORD: "CHANGE_ME"
  AI_BACKUP_POSTGRES_PASSWORD: "CHANGE_ME"
  AI_MIGRATION_POSTGRES_PASSWORD: "CHANGE_ME"
  # Only required when LLM_PROVIDER is a real provider.
  LLM_API_KEY: ""
  LLM_BASE_URL: ""
  LLM_CHAT_MODEL: ""
  LLM_EMBEDDING_MODEL: ""
  # Only required when the S3-backed object store needs credentials.
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  # Required when AI_ENV is production/staging. Generate with
  # `openssl rand -hex 32`; used by the API/worker /metrics endpoints and
  # the Prometheus scrape configuration. At least 32 characters.
  AI_METRICS_AUTH_TOKEN: ""
  # Optional backends.
  OPENSEARCH_USERNAME: ""
  OPENSEARCH_PASSWORD: ""
  GRAFANA_ADMIN_PASSWORD: ""
  # Backup encryption passphrase (SEC-20). Required in production because the
  # base config sets BACKUP_REQUIRE_ENCRYPTION=true. Store it in the same
  # secret manager as the database credentials and keep an offline copy for
  # disaster recovery; losing it makes encrypted artifacts unrecoverable.
  BACKUP_ENCRYPTION_PASSPHRASE: ""
