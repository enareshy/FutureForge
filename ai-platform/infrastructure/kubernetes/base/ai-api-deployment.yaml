apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
  labels:
    app.kubernetes.io/name: ai-api
    app.kubernetes.io/part-of: enterprise-ai-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-api
        app.kubernetes.io/part-of: enterprise-ai-platform
        app.kubernetes.io/component: backend
      annotations:
        # /metrics is served on the same port as the API and requires the
        # AI_METRICS_AUTH_TOKEN bearer token. Scraping is restricted to the
        # observability namespace by the allow-metrics-scrape NetworkPolicy.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ai-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-api
          image: enterprise-ai-platform/ai-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-api-config
            - secretRef:
                name: ai-api-secrets
          env:
            - name: POSTGRES_USER
              value: ai_api
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-api-secrets
                  key: AI_API_POSTGRES_PASSWORD
            - name: AI_DB_ROLE_PROFILE
              value: api
            - name: AI_DB_EXPECTED_ROLE
              value: ai_api
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
