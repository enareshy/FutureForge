# Monthly restore drill.
#
# The daily `ai-backup` CronJob only writes an artifact. `AIRestoreDrillStale`
# alerts after 90 days without a successful `restore_drill` row, but until this
# CronJob existed nothing in the cluster produced one. This job restores the
# newest verified artifact into an isolated database and bucket with the
# `ai_restore` credential, runs the validation checks, and records the run in
# `ai.backup_runs` (kind `restore_drill`), which the API exposes as
# `ai_backup_last_success_timestamp_seconds{kind="restore_drill"}`.
#
# It deliberately runs without `--start-app`/`--run-workers`: the backup image
# does not contain the application package, and the in-cluster API is already
# probed by its own readiness gate. Use the operator-run CLI in
# docs/kubernetes-rollout.md Section 7 when a live application check against
# the restored data is required.
#
# Cleanup is NOT automated. The completed drill leaves one database
# `ai_restore_drill_<timestamp>` and one bucket `ai-knowledge-restore-drill-*`.
# An operator removes them with `backup_restore.py cleanup --execute` after the
# report is reviewed; there is no scheduled DROP DATABASE.
#
# The run reads and writes the same `ai-backup-data` PVC as the daily backup,
# and both take the same advisory lock. The backup starts at 02:15 with a
# 2-hour active deadline, so this runs at 06:00 to leave more than three hours
# of headroom; concurrencyPolicy=Forbid covers retries of this job but does not
# coordinate with the other CronJob. If either schedule is moved, keep the gap
# wider than the backup's activeDeadlineSeconds.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-restore-drill
  labels:
    app.kubernetes.io/name: ai-backup
    app.kubernetes.io/part-of: enterprise-ai-platform
    app.kubernetes.io/component: restore-drill
spec:
  schedule: "0 6 1 * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: ai-backup
        app.kubernetes.io/part-of: enterprise-ai-platform
        app.kubernetes.io/component: restore-drill
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ai-backup
            app.kubernetes.io/part-of: enterprise-ai-platform
            app.kubernetes.io/component: restore-drill
        spec:
          serviceAccountName: ai-backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restore-drill
              image: enterprise-ai-platform/ai-backup:0.1.0
              imagePullPolicy: IfNotPresent
              args: ["drill"]
              envFrom:
                # Same non-secret config and backup-side credentials as the
                # daily backup Job. The restore credential is kept OUT of
                # `ai-api-secrets` and mounted separately below, so serving
                # pods never receive a role that can create databases.
                - configMapRef:
                    name: ai-api-config
                - secretRef:
                    name: ai-api-secrets
              env:
                # The source side reads the newest artifact and, when the
                # artifact is encrypted, needs the passphrase from the secret.
                - name: POSTGRES_USER
                  value: ai_backup
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ai-api-secrets
                      key: AI_BACKUP_POSTGRES_PASSWORD
                - name: AI_DB_ROLE_PROFILE
                  value: backup
                - name: AI_DB_EXPECTED_ROLE
                  value: ai_backup
                # The drill target side creates the isolated database and
                # bucket. This role is NOT used by the API or workers.
                - name: RESTORE_TARGET_USER
                  value: ai_restore
                - name: RESTORE_TARGET_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ai-restore-secret
                      key: password
                - name: RESTORE_TARGET_ROLE_PROFILE
                  value: restore
                - name: RESTORE_TARGET_EXPECTED_ROLE
                  value: ai_restore
                - name: BACKUP_DIR
                  value: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: ai-backup-data
            - name: tmp
              emptyDir: {}
