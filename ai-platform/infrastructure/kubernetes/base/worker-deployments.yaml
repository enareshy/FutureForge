# Background reliability workers. They run the same image as the API with an
# explicit module command; the API server is never started here.
#
# Replica counts are constrained by the current coordination primitives:
#   event consumer - one replica; the outbox has no atomic claim, so two
#                    consumers could process the same event concurrently;
#   reconciler     - one replica; no global scheduler lease yet, and purge
#                    must not race;
#   indexer        - one replica; queued jobs are selected without SKIP LOCKED;
#   agent          - one replica by default (lease/fence safe to scale later).
# See docs/WORKER_DEPLOYMENT.md before changing any of these.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-event-consumer
  labels:
    app.kubernetes.io/name: ai-event-consumer
    app.kubernetes.io/part-of: enterprise-ai-platform
    app.kubernetes.io/component: worker
    app.kubernetes.io/worker: event-consumer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-event-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-event-consumer
        app.kubernetes.io/part-of: enterprise-ai-platform
        app.kubernetes.io/component: worker
        app.kubernetes.io/worker: event-consumer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ai-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: event-consumer
          image: enterprise-ai-platform/ai-api:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - ai_api.workers.event_consumer
            - --watch
            - --metrics-port
            - "9100"
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-api-config
            - secretRef:
                name: ai-api-secrets
          env:
            - name: POSTGRES_USER
              value: ai_worker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-api-secrets
                  key: AI_WORKER_POSTGRES_PASSWORD
            - name: AI_DB_ROLE_PROFILE
              value: worker
            - name: AI_DB_EXPECTED_ROLE
              value: ai_worker
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
