# Production resource envelope for the AI API. Requests are what the
# scheduler reserves; limits cap a runaway pod. Tune to the customer's node
# sizes and observed load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
spec:
  template:
    spec:
      containers:
        - name: ai-api
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
