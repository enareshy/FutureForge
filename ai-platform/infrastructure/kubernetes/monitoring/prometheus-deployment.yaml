# Minimal in-cluster Prometheus for the backup alerts.
#
# This is a plain Deployment, not the Prometheus Operator, so it works on a
# cluster without monitoring CRDs. If the cluster already runs the Operator,
# prefer its `ServiceMonitor`/`PrometheusRule` objects instead of this file; see
# docs/kubernetes-rollout.md Section 8.
#
# The mounted objects are generated by `scripts/k8s-monitoring-config.sh`:
#   ai-prometheus-config (ConfigMap) - prometheus-kubernetes.yml
#   ai-prometheus-rules  (ConfigMap) - backup-alerts.yml
#   ai-metrics-token     (Secret)    - AI_METRICS_AUTH_TOKEN (shared with ai-api-secrets)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: enterprise-ai-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: enterprise-ai-platform
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.5
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.listen-address=0.0.0.0:9090
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: metrics-token
              mountPath: /etc/prometheus/metrics
              readOnly: true
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: ai-prometheus-config
        - name: rules
          configMap:
            name: ai-prometheus-rules
        - name: metrics-token
          secret:
            secretName: ai-metrics-token
            # Projected under a neutral file name so the scrape config does not
            # embed the Secret key name.
            items:
              - key: token
                path: metrics-token
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
        - name: tmp
          emptyDir: {}
