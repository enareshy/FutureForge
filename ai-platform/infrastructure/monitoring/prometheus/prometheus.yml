global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    platform: enterprise-ai-platform

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The OpenTelemetry Collector receives OTLP from the AI API, indexing
  # workers and Kafka consumers, and re-exposes metrics here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The AI API exposes Prometheus metrics directly at /metrics.
  #
  # In the local compose stack the API runs on the host (not as a service),
  # so it is reached through the host gateway. `docker-compose` adds the
  # `host.docker.internal` host mapping; in Kubernetes, point this target at
  # the in-cluster Service (or use a ServiceMonitor) instead.
  - job_name: ai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
