global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    platform: enterprise-ai-platform

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The OpenTelemetry Collector receives OTLP from the AI API, indexing
  # workers and Kafka consumers, and re-exposes metrics here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
